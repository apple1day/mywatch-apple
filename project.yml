name: WatchLink
options:
  minimumXcodeGenVersion: 2.38.0
  deploymentTarget:
    iOS: '16.0'
  createIntermediateGroups: true
  developmentLanguage: zh-Hans
configs:
  Debug: debug
  Release: release
settings:
  base:
    SWIFT_VERSION: '5.0'
    IPHONEOS_DEPLOYMENT_TARGET: '16.0'
    TARGETED_DEVICE_FAMILY: '1,2'
    MARKETING_VERSION: '0.4.2'
    CURRENT_PROJECT_VERSION: '7'
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    CLANG_ENABLE_MODULES: YES
targets:
  WatchLink:
    type: application
    platform: iOS
    sources:
      - Sources/WatchLink
      - path: Resources
        excludes:
          - Info.plist
    configFiles:
      Debug: Config/WatchLink.Debug.xcconfig
      Release: Config/WatchLink.Release.xcconfig
    settings:
      base:
        PRODUCT_NAME: WatchLink
        PRODUCT_MODULE_NAME: WatchLink
        INFOPLIST_FILE: Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
  WatchLinkTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests/WatchLinkTests
    configFiles:
      Debug: Config/WatchLinkTests.Debug.xcconfig
      Release: Config/WatchLinkTests.Release.xcconfig
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: WatchLink
  WatchLinkUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - Tests/WatchLinkUITests
    configFiles:
      Debug: Config/WatchLinkUITests.Debug.xcconfig
      Release: Config/WatchLinkUITests.Release.xcconfig
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: WatchLink
    dependencies:
      - target: WatchLink
schemes:
  WatchLink:
    build:
      targets:
        WatchLink: all
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      coverageTargets:
        - WatchLink
      targets:
        - WatchLinkTests
        - WatchLinkUITests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
    management:
      shared: true
