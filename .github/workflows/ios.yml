name: iOS build and tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: watchlink-ios-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Record Xcode and SDK
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
      - name: Generate Xcode project
        run: bash setup.sh --no-open
      - name: Build unsigned iPhone app
        run: bash scripts/ci.sh device
      - name: Upload unsigned device app
        uses: actions/upload-artifact@v4
        with:
          name: WatchLink-iOS-device-build
          path: |
            dist/WatchLink-iOS-unsigned-0.4.0.zip
            dist/BUILD-ARTIFACTS.txt
            dist/SHA256SUMS.txt
          retention-days: 14
      - name: Run unit and UI tests on an available iPhone simulator
        timeout-minutes: 20
        run: bash scripts/ci.sh test
      - name: Upload simulator app
        uses: actions/upload-artifact@v4
        with:
          name: WatchLink-iOS-simulator-build
          path: dist/WatchLink-iOS-simulator-0.4.0.zip
          retention-days: 14
      - name: Export simulator screenshots
        if: always()
        run: bash scripts/ci.sh attachments
      - name: Upload test results and screenshots
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: WatchLink-test-results
          path: |
            build/*.xcresult/
            build/TestAttachments/
            build/*.log
            build/simulator-devices.json
          if-no-files-found: ignore
          retention-days: 14
